# competition_2026_route.yaml — 2026 赛季射击挑战赛导航路线配置
# 坐标系: map (AMCL 校正后的绝对坐标)

# 固定起点: 每次小车放在胶带标记处，代码自动发布此位姿到 /initialpose
start_pose:
  x: 0.031
  y: -0.020
  yaw: 0.0

route_points:
  # ── 射击点1: 环形计分靶 (20分) ──
  - id: 1
    name: "射击点1-环形靶"
    type: "task"
    target_type: "circular"
    x: 1.225
    y: -0.334
    yaw: 0.0
    task_zone:
      x_min: 1.035
      x_max: 1.415
      y_min: -0.494
      y_max: -0.174

  # ── 途经点1 ──
  - id: 2
    name: "途经点1"
    type: "relay"
    x: 0.167
    y: -1.064
    yaw: 0.0

  # ── 射击点2: 旋转靶 (15分) ──
  - id: 3
    name: "射击点2-旋转靶"
    type: "task"
    target_type: "rotating"
    x: 0.927
    y: -1.636
    yaw: 0.0
    task_zone:
      x_min: 0.737
      x_max: 1.117
      y_min: -1.796
      y_max: -1.476

  # ── 途经点2 ──
  - id: 4
    name: "途经点2"
    type: "relay"
    x: 0.208
    y: -2.181
    yaw: 0.0

  # ── 射击点3: 移动靶 (15分) ──
  - id: 5
    name: "射击点3-移动靶"
    type: "task"
    target_type: "moving"
    x: 0.976
    y: -2.927
    yaw: 0.0
    task_zone:
      x_min: 0.786
      x_max: 1.166
      y_min: -3.087
      y_max: -2.767

  # ── 终点区域 (10分) ──
  - id: 6
    name: "终点"
    type: "end"
    x: 0.055
    y: -3.248
    yaw: 0.0

target_ids:
  rotating: 1
  moving: 6

global:
  relay_close_threshold: 0.10
  end_close_threshold: 0.15
  task_timeout: 60.0
  shoot_timeout: 15.0
  shoot_cooldown: 2.0

field:
  size: 3.6
  half_size: 1.8
