# competition_2026_route.yaml — 2026 赛季射击挑战赛导航路线配置
# 坐标系: map (AMCL 校正后的绝对坐标)

start_pose:
  x: 0.031
  y: -0.020
  yaw: 0.0

route_points:
  # ── 射击点1: 环形计分靶 (20分) ──
  - id: 1
    name: "射击点1-环形靶"
    type: "task"
    target_type: "circular"
    x: 1.225
    y: -0.464
    yaw: 0.0

  # ── 途经点1 (快速通过) ──
  - id: 2
    name: "途经点1"
    type: "relay"
    x: 0.207
    y: -1.064
    yaw: 0.0

  # ── 射击点2: 旋转靶 (15分) ──
  - id: 3
    name: "射击点2-旋转靶"
    type: "task"
    target_type: "rotating"
    x: 1.227
    y: -1.736
    yaw: 0.0

  # ── 途经点2 (快速通过 + yaw校正) ──
  - id: 4
    name: "途经点2"
    type: "relay"
    x: 0.208
    y: -2.181
    yaw: 0.0

  # ── 射击点3: 移动靶 (15分) ──
  - id: 5
    name: "射击点3-移动靶"
    type: "task"
    target_type: "moving"
    x: 1.176
    y: -2.927
    yaw: 0.0

  # ── 终点 (10分)。costmap 阻挡，先到前置点再低速滑入 ──
  - id: 6
    name: "终点"
    type: "end"
    x: 0.005
    y: -3.250
    yaw: 0.0
    pre_point:
      x: 0.40
      y: -3.09
      yaw: 0.0

target_ids:
  rotating: 1
  moving: 6

global:
  relay_close_threshold: 0.25
  end_close_threshold: 0.08
  task_timeout: 60.0
  shoot_timeout: 15.0
  shoot_cooldown: 2.0

field:
  size: 3.6
  half_size: 1.8
