# competition_2026_route.yaml — 2026 赛季射击挑战赛导航路线配置
# 坐标系: map (AMCL 校正后的绝对坐标)

start_pose:
  x: 0.031
  y: -0.020
  yaw: 0.0

route_points:
  # ── 射击点1: 环形计分靶 (20分) ──
  - id: 1
    name: "射击点1-环形靶"
    type: "task"
    target_type: "circular"
    x: 1.160
    y: -0.464
    yaw: 0.0

  # ── 后退1: 退回安全 x 走廊 ──
  - id: 2
    name: "后退1"
    type: "back_y_only"
    x: 0.150
    y: -0.534
    yaw: 0.0

  # ── 途经安全点1 (退到安全 x 走廊) ──
  - id: 3
    name: "途经安全点1"
    type: "relay"
    x: 0.200
    y: -1.464
    yaw: 0.0

  # ── 射击点2: 旋转靶 (15分) ──
  - id: 4
    name: "射击点2-旋转靶"
    type: "task"
    target_type: "rotating"
    x: 1.160
    y: -1.686
    yaw: 0.0

  # ── 后退2:退回安全 x 走廊 ──
  - id: 5
    name: "后退2"
    type: "back_y_only"
    x: 0.200
    y: -2.06
    yaw: 0.0

  # ── 途经安全点2 (退到安全 x 走廊) ──
  - id: 6
    name: "途经安全点2"
    type: "relay"
    x: 0.2000
    y: -2.71
    yaw: 0.0

  # ── 射击点3: 移动靶 (15分) ──
  - id: 7
    name: "射击点3-移动靶"
    type: "task"
    target_type: "moving"
    x: 1.160
    y: -2.970
    yaw: 0.0

  # ── 终点 (10分)。costmap 阻挡，先到前置点再低速滑入 ──
  - id: 8
    name: "终点"
    type: "end"
    x: 0.030
    y: -3.305
    yaw: 0.0
    pre_point:
      x: 0.200
      y: -3.00
      yaw: 0.0

global:
  relay_close_threshold: 0.25
  end_close_threshold: 0.08
  task_timeout: 60.0
  # Predictive rotating gate needs up to half a 26s cycle plus observe/turn.
  shoot_timeout: 22.0
  voice_ready_timeout: 60.0
  voice_wait_timeout: 30.0
  # Short controlled nudge after voice target confirmation and before the
  # first move_base goal. Positive vx is robot body-frame forward.
  start_clear_enabled: true
  start_clear_vx: 0.12
  start_clear_vy: 0.0
  start_clear_duration: 0.45
  start_clear_settle: 0.15

# 射击瞄准参数集中在 competition_control.py 顶部的
# "Shooting Manual Tuning" 区域，避免 Python/YAML 两处参数冲突。

field:
  size: 3.6
  half_size: 1
