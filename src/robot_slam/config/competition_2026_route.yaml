# competition_2026_route.yaml — 2026 赛季射击挑战赛导航路线配置
# 状态机按 route_points 列表顺序依次遍历

# 起点坐标 (-0.98, -0.98) — 在 RViz 中以此设置初始位姿

route_points:
  # ── 射击点1: 环形计分靶 (20分) ──
  - id: 1
    name: "射击点1-环形靶"
    type: "task"
    target_type: "circular"
    x: 0.12
    y: -1.38
    yaw: 0.0
    task_zone:
      x_min: -0.07
      x_max: 0.31
      y_min: -1.54
      y_max: -1.22

  # ── 途经点1 ──
  - id: 2
    name: "途经点1"
    type: "relay"
    x: -0.88
    y: -2.14
    yaw: 0.0

  # ── 射击点2: 旋转靶 (15分) ──
  - id: 3
    name: "射击点2-旋转靶"
    type: "task"
    target_type: "rotating"
    x: 0.08
    y: -2.78
    yaw: 0.0
    task_zone:
      x_min: -0.11
      x_max: 0.27
      y_min: -2.94
      y_max: -2.62

  # ── 途经点2 ──
  - id: 4
    name: "途经点2"
    type: "relay"
    x: -0.92
    y: -3.46
    yaw: 0.0

  # ── 射击点3: 移动靶 (15分) ──
  - id: 5
    name: "射击点3-移动靶"
    type: "task"
    target_type: "moving"
    x: 0.02
    y: -4.08
    yaw: 0.0
    task_zone:
      x_min: -0.17
      x_max: 0.21
      y_min: -4.24
      y_max: -3.92

  # ── 终点区域 (10分) ──
  - id: 6
    name: "终点"
    type: "end"
    x: -1.16
    y: -4.46
    yaw: 0.0

# 目标ID
target_ids:
  rotating: 1
  moving: 6

# 全局参数
global:
  relay_close_threshold: 0.10
  end_close_threshold: 0.15
  task_timeout: 60.0
  shoot_timeout: 15.0
  shoot_cooldown: 2.0

# 场地参数
field:
  size: 3.6
  half_size: 1.8
