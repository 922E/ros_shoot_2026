# competition_2026_route.yaml — 2026 赛季射击挑战赛导航路线配置
# 状态机按 route_points 列表顺序依次遍历

route_points:
  # ── 射击点1: 环形计分靶 (20分) ──
  - id: 1
    name: "射击点1-环形靶"
    type: "task"
    target_type: "circular"
    x: 0.06
    y: -1.52
    yaw: 0.0
    task_zone:
      x_min: -0.13
      x_max: 0.25
      y_min: -1.68
      y_max: -1.36

  # ── 途经点1 ──
  - id: 2
    name: "途经点1"
    type: "relay"
    x: -1.04
    y: -2.18
    yaw: 0.0

  # ── 射击点2: 旋转靶 (15分) ──
  - id: 3
    name: "射击点2-旋转靶"
    type: "task"
    target_type: "rotating"
    x: -0.22
    y: -2.9
    yaw: 0.0
    task_zone:
      x_min: -0.41
      x_max: -0.03
      y_min: -3.06
      y_max: -2.74

  # ── 途经点2 ──
  - id: 4
    name: "途经点2"
    type: "relay"
    x: -1.16
    y: -3.48
    yaw: 0.0

  # ── 射击点3: 移动靶 (15分) ──
  - id: 5
    name: "射击点3-移动靶"
    type: "task"
    target_type: "moving"
    x: -0.34
    y: -4.2
    yaw: 0.0
    task_zone:
      x_min: -0.53
      x_max: -0.15
      y_min: -4.36
      y_max: -4.04

  # ── 终点区域 (10分) ──
  - id: 6
    name: "终点"
    type: "end"
    x: -1.44
    y: -4.52
    yaw: 0.0

# 目标ID (语音可用时自动覆盖，语音未启动时使用此默认值)
target_ids:
  rotating: 1      # 旋转靶 AR 标签 ID (无语音时使用)
  moving: 6        # 移动靶 AR 标签 ID (无语音时使用)

# 全局参数
global:
  relay_close_threshold: 0.10    # 中继点判近距离 (米)
  end_close_threshold: 0.15      # 终点判近距离 (米)
  task_timeout: 60.0             # 单个任务点超时 (秒)
  shoot_timeout: 15.0            # 射击超时 (秒)
  shoot_cooldown: 2.0            # 射击后冷却 (秒)

# 场地参数
field:
  size: 3.6
  half_size: 1.8
